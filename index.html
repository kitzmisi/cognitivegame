<!DOCTYPE html>
<html lang="hu"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PI kognitív gyakorlóteszt</title>
<style>
:root{--bg:#f6f7f4;--ink:#1c2430;--mute:#5d6875;--line:#cfd5db;--card:#fff;--acc:#1f4fd8;--ok:#1b7f4b;--bad:#b3261e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14181d;--ink:#e7eaee;--mute:#9aa5b1;--line:#2c343d;--card:#1c222a;--acc:#7da2ff;--ok:#5fd394;--bad:#ff8a80}}
:root[data-theme="dark"]{--bg:#14181d;--ink:#e7eaee;--mute:#9aa5b1;--line:#2c343d;--card:#1c222a;--acc:#7da2ff;--ok:#5fd394;--bad:#ff8a80}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:1.5rem;margin:0 0 8px}
p{margin:0 0 12px;color:var(--mute)}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-variant-numeric:tabular-nums}
.time{font-size:1.4rem;font-weight:700}
.time.low{color:var(--bad)}
.track{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:22px}
.fill{height:100%;background:var(--acc);width:0;transition:width .2s}
.tag{color:var(--mute);font-size:.9rem;margin-bottom:6px}
.q{font-size:1.3rem;font-weight:600;margin:0 0 18px;white-space:pre-line}
.opt{display:block;width:100%;text-align:left;padding:14px 16px;margin-bottom:10px;background:var(--card);color:var(--ink);border:1.5px solid var(--line);border-radius:10px;font:inherit;cursor:pointer}
.opt:hover{border-color:var(--acc)}
.opt:focus-visible,.btn:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.btn{padding:12px 22px;background:var(--acc);color:#fff;border:0;border-radius:10px;font:inherit;font-weight:600;cursor:pointer}
:root[data-theme="dark"] .btn{color:#10151b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn{color:#10151b}}
.score{font-size:2.6rem;font-weight:800;margin:4px 0}
.row{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px}
.row b.ok{color:var(--ok)}.row b.no{color:var(--bad)}
.row small{display:block;color:var(--mute)}
.hide{display:none}
</style></head><body><main>
<section id="start">
<h1>Predictive Index – gyakorlóteszt</h1>
<p>50 kérdés, 12 perc. Numerikus, verbális és mintafelismerő feladatok. Válaszadás után azonnal jön a következő kérdés, ezért ne időzz: a tempó számít. Kihagyni nem lehet, tippelj, ha kell.</p>
<button class="btn" id="go">Indítás</button>
</section>
<section id="quiz" class="hide">
<div class="bar"><span id="cnt"></span><span class="time" id="time">12:00</span></div>
<div class="track"><div class="fill" id="fill"></div></div>
<div class="tag" id="cat"></div>
<div class="q" id="q"></div>
<div id="opts"></div>
</section>
<section id="end" class="hide">
<h1 id="endtitle">Eredmény</h1>
<div class="score" id="score"></div>
<p id="sub"></p>
<div id="review"></div>
<button class="btn" id="again">Újra</button>
</section>
</main>
<script>
var Q=[
["Numerikus","4, 9, 19, 39, ?",["78","79","80","81"],1,"Előző × 2 + 1."],
["Numerikus","100, 91, 82, 73, ?",["62","63","64","65"],2,"Minden lépés −9."],
["Numerikus","1, 4, 9, 16, 25, ?",["30","34","36","49"],2,"Négyzetszámok."],
["Numerikus","3, 5, 9, 17, 33, ?",["55","63","65","66"],2,"A különbség mindig duplázódik: 2, 4, 8, 16, 32."],
["Numerikus","64, 32, 16, 8, ?",["2","4","6","0"],1,"Mindig felezés."],
["Numerikus","5, 7, 11, 19, 35, ?",["51","63","67","70"],2,"Különbségek: 2, 4, 8, 16, 32."],
["Numerikus","Mennyi 350 20%-a?",["60","65","70","75"],2,"350 × 0,2 = 70."],
["Numerikus","12 × 15 = ?",["160","170","180","190"],2,"12 × 15 = 180."],
["Numerikus","Mennyi 96 háromnegyede?",["64","68","72","76"],2,"96 / 4 × 3 = 72."],
["Numerikus","Egy termék ára 80 euró, 25% kedvezményt kap. Mi az új ár?",["55","60","64","65"],1,"80 − 20 = 60."],
["Numerikus","Egy autó 90 km/h sebességgel 2 óra 40 percig megy. Hány km-t tesz meg?",["220","230","240","250"],2,"90 × 8/3 = 240."],
["Numerikus","6 munkás 12 nap alatt végez egy munkával. Hány nap alatt végez vele 9 munkás?",["6","8","9","18"],1,"72 munkásnap / 9 = 8 nap."],
["Numerikus","5 kg alma 1250 Ft. Mennyibe kerül 8 kg?",["1800","2000","2100","2250"],1,"250 Ft/kg × 8 = 2000."],
["Numerikus","Mennyi a 4, 8, 12, 16, 20 átlaga?",["10","12","14","16"],1,"60 / 5 = 12."],
["Numerikus","Ha 3x + 7 = 28, mennyi x?",["5","6","7","8"],2,"3x = 21, x = 7."],
["Numerikus","0,25 × 0,4 = ?",["0,01","0,1","0,65","1"],1,"1/4 × 0,4 = 0,1."],
["Numerikus","Két szám aránya 3:5, összegük 40. Mekkora a nagyobb?",["15","20","25","30"],2,"40 / 8 = 5, 5 × 5 = 25."],
["Numerikus","1, 2, 6, 24, 120, ?",["240","600","720","840"],2,"Szorzók: 2, 3, 4, 5, 6."],
["Verbális","Orvos : kórház = tanár : ?",["iskola","diák","tábla","könyv"],0,"Foglalkozás és munkahelye."],
["Verbális","Gyors : lassú = kicsi : ?",["apró","óriási","könnyű","éles"],1,"Ellentét."],
["Verbális","Melyik nem illik a többi közé?",["kék","piros","zöld","kerek"],3,"A többi szín."],
["Verbális","Melyik nem illik a többi közé?",["zongora","hegedű","fuvola","ecset"],3,"A többi hangszer."],
["Verbális","Melyik szó a legellentétesebb az „elavult” szóval?",["régi","modern","kopott","drága"],1,"Elavult ↔ modern."],
["Verbális","Melyik szó jelentése áll legközelebb a „szorgalmas” szóhoz?",["lusta","dolgos","buta","hangos"],1,"Szinonimák."],
["Verbális","Melyik szó jelentése áll legközelebb a „kiváló” szóhoz?",["közepes","remek","ritka","gyenge"],1,"Szinonimák."],
["Verbális","Melyik szó a legellentétesebb a „gyakori” szóval?",["állandó","ritka","ismert","hangos"],1,"Gyakori ↔ ritka."],
["Logikai","Tomi gyorsabb Zolinál, Zoli gyorsabb Gábornál. Ki a leglassabb?",["Tomi","Zoli","Gábor","Nem állapítható meg"],2,"Tomi > Zoli > Gábor."],
["Logikai","Minden madár tud repülni. A pingvin nem tud repülni. Mi következik ebből?",["A pingvin madár","A pingvin nem madár","Minden madár pingvin","Semmi nem következik"],1,"Az állítások szerint ami madár, tud repülni."],
["Logikai","Ha esik, a föld nedves. A föld nedves. Mi következik?",["Esett az eső","Nem esett az eső","Semmi biztosat nem lehet mondani","A föld száraz"],2,"Más oka is lehet a nedvességnek."],
["Logikai","Néhány tanár zenész. Minden zenész szereti a zenét. Melyik biztosan igaz?",["Minden tanár szereti a zenét","Néhány tanár szereti a zenét","Egyetlen tanár sem zenész","Minden zenész tanár"],1,"A zenész tanárok szeretik a zenét."],
["Logikai","Ma szerda van. Milyen nap volt 3 nappal ezelőtt?",["vasárnap","hétfő","szombat","kedd"],0,"Szerda − 3 nap = vasárnap."],
["Logikai","Anna 5 évvel idősebb Bélánál, Béla 3 évvel idősebb Csabánál. Anna 20 éves. Hány éves Csaba?",["10","12","15","8"],1,"Béla 15, Csaba 12."],
["Logikai","Egy sorban Kata elölről a 3., hátulról a 7. Hányan állnak a sorban?",["9","10","11","8"],0,"3 + 7 − 1 = 9."],
["Logikai","Hét : nap = év : ?",["hónap","évszak","évtized","óra"],0,"Az egység és a benne lévő részek."],
["Mintafelismerés","▲ ● ● ▲ ● ● ▲ ?",["▲","●","■","◆"],1,"3 elemenként ismétlődik."],
["Mintafelismerés","B, D, G, K, ?  (angol ábécé)",["N","O","P","Q"],2,"Ugrások: +2, +3, +4, +5."],
["Mintafelismerés","Z, X, V, T, ?  (angol ábécé)",["S","R","Q","P"],1,"Minden második betű visszafelé."],
["Mintafelismerés","AB, CD, EF, GH, ?",["HI","IJ","JK","IK"],1,"Egymás utáni betűpárok."],
["Mintafelismerés","2, 3, 5, 7, 11, ?",["12","13","14","15"],1,"Prímszámok."],
["Mintafelismerés","1, 3, 6, 10, 15, ?",["19","20","21","22"],2,"Különbségek: 2, 3, 4, 5, 6."],
["Mintafelismerés","2, 6, 18, 54, ?",["108","148","162","216"],2,"Mindig × 3."],
["Mintafelismerés","8, 6, 9, 7, 10, ?",["8","9","11","12"],0,"Felváltva −2 és +3."],
["Mintafelismerés","1, 2, 4, 7, 11, ?",["15","16","17","18"],1,"Különbségek: 1, 2, 3, 4, 5."],
["Mintafelismerés","■ □ □ ■ □ □ ■ ?",["■","□","▲","●"],1,"3 elemenként ismétlődik."],
["Mintafelismerés","3, 6, 5, 10, 9, 18, ?",["16","17","19","36"],1,"Felváltva × 2 és −1."],
["Mintafelismerés","AZ, BY, CX, DW, ?",["EU","EV","FV","DV"],1,"Az első betű előre, a második hátra lép."],
["Mintafelismerés","1, 8, 27, 64, ?",["100","116","125","216"],2,"Köbszámok."],
["Mintafelismerés","5, 10, 8, 16, 14, 28, ?",["24","26","30","56"],1,"Felváltva × 2 és −2."],
["Mintafelismerés","96, 48, 24, 12, ?",["4","6","8","10"],1,"Mindig felezés."],
["Mintafelismerés","2, 4, 3, 9, 4, 16, 5, ?",["20","24","25","30"],2,"Az n szám után n² következik."]];
var TOTAL=720,i,ans,left,timer;
function $(id){return document.getElementById(id)}
function show(id){["start","quiz","end"].forEach(function(s){$(s).classList.toggle("hide",s!==id)})}
function fmt(s){return Math.floor(s/60)+":"+("0"+s%60).slice(-2)}
function start(){i=0;ans=[];left=TOTAL;show("quiz");tick();clearInterval(timer);timer=setInterval(function(){left--;tick();if(left<=0)finish(true)},1000);render()}
function tick(){$("time").textContent=fmt(Math.max(left,0));$("time").classList.toggle("low",left<=60)}
function render(){
 var q=Q[i];$("cnt").textContent=(i+1)+" / "+Q.length;$("fill").style.width=(i/Q.length*100)+"%";
 $("cat").textContent=q[0];$("q").textContent=q[1];
 var o=$("opts");o.innerHTML="";
 q[2].forEach(function(t,k){var b=document.createElement("button");b.className="opt";b.textContent=String.fromCharCode(97+k)+") "+t;b.onclick=function(){pick(k)};o.appendChild(b)});
}
function pick(k){ans[i]=k;i++;if(i>=Q.length)finish(false);else render()}
function finish(timeout){
 clearInterval(timer);var ok=0;
 Q.forEach(function(q,n){if(ans[n]===q[3])ok++});
 var used=TOTAL-Math.max(left,0);
 $("endtitle").textContent=timeout?"Lejárt az idő":"Kész";
 $("score").textContent=ok+" / "+Q.length;
 $("sub").textContent="Felhasznált idő: "+fmt(used)+" ("+ans.filter(function(a){return a!==undefined}).length+" megválaszolt kérdés)";
 var r=$("review");r.innerHTML="";
 Q.forEach(function(q,n){
  var d=document.createElement("div");d.className="row";
  var g=ans[n],good=g===q[3];
  var head=document.createElement("b");head.className=good?"ok":"no";head.textContent=(n+1)+". "+(good?"Helyes":g===undefined?"Nem jutottál el idáig":"Hibás");
  var s1=document.createElement("small");s1.textContent=q[1].replace(/\n/g," ");
  var s2=document.createElement("small");
  s2.textContent=(good?"":(g!==undefined?"A te válaszod: "+q[2][g]+". ":""))+"Helyes: "+q[2][q[3]]+" – "+q[4];
  d.appendChild(head);d.appendChild(s1);d.appendChild(s2);r.appendChild(d);
 });
 show("end");window.scrollTo(0,0);
}
$("go").onclick=start;$("again").onclick=start;
</script></body></html>
